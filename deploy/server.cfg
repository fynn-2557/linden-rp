# Linden RP NRW – txAdmin test server, NOT production-ready
# Edit secrets, FivePRS permissions, and test before admitting players.
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
{{serverEndpoints}}
set mysql_connection_string "{{dbConnectionString}}"
set onesync on
sv_enforceGameBuild 3258
set resources_useSystemChat true
setr esx:locale "de"
set linden_framework "esx"
set linden_sync_native_jobs "false"

# Disabled until Discord bot API and secrets are configured.
set rp_identity_whitelist "false"
set rp_identity_api "http://127.0.0.1:4792"
# REQUIRED before enabling whitelist: replace with long random value and use same RP_API_SECRET in bot/.env
set rp_identity_api_secret "SET_A_RANDOM_SECRET_BEFORE_WHITELIST_GOES_LIVE"
set rp_identity_fiveprs_ace "true"
set fiveprs_db_type "mysql"
set fiveprs_restrict_departments true
set fiveprs_server_icon false

add_principal group.admin group.user
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow
add_ace resource.fiveprs command.load_server_icon allow
add_ace group.rp_police fiveprs.department.police allow
add_ace group.rp_fire fiveprs.department.fire allow
add_ace group.rp_ems fiveprs.department.ems allow
add_ace group.admin linden.creator allow
add_ace group.admin linden.dispatcher allow
{{addPrincipalsMaster}}

sv_enableNetworkedSounds false
sv_enableNetworkedScriptEntityStates false
sv_enableNetworkedPhoneExplosions false
sv_filterRequestControl 2

ensure mapmanager
ensure spawnmanager
ensure sessionmanager
ensure oxmysql
ensure ox_lib
ensure esx_lib
ensure es_extended
# Native ESX character creator/multichar are intentionally NOT started;
# Linden/FivePRS character synchronization is still incomplete.
ensure fiveprs
ensure linden_rp
