name: Local regression tests
on: [push, pull_request]
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/requirements.txt
      - run: node --test tests/*.test.js
      - run: python tests/test_spawn_compat.py
      - run: python tests/verify_merge.py
      - name: Updater (PowerShell 7)
        shell: pwsh
        run: ./tests/updater.tests.ps1 -TestRoot "$env:RUNNER_TEMP/linden-updater-ps7"
      - name: Updater (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/updater.tests.ps1 -TestRoot "$env:RUNNER_TEMP/linden-updater-ps51"
